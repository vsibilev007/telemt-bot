name: Docker

on:
  push:
    branches: [main]
    # v* — трёх- и двухкомпонентные теги (v1.0.0 / v1.6):
    # "v*.*.*" не ловил двухкомпонентные, и release-джоба не запускалась.
    tags: ["v*", "v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/telemt-bot

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install dependencies
        run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt pytest
      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

  build-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load for scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Pushed digest ${{ steps.push.outputs.digest }}"

  # Релиз собирается из исходников в build-push; здесь создаётся GitHub Release
  # с описанием из .github/RELEASE_BODY.md (обновляется в каждом релизном коммите).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Первая строка RELEASE_BODY.md — заголовок вида "# v1.7 — ..."
          TITLE="$(head -1 .github/RELEASE_BODY.md | sed 's/^# //')"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file .github/RELEASE_BODY.md

  # Автообновляемый pre-release «rolling»: после каждого успешного билда main
  # страница Releases показывает свежий список коммитов и ссылку на образ.
  rolling-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --exclude 'rolling' 2>/dev/null || true)"
          {
            echo "# Сборка main — $(date -u '+%Y-%m-%d %H:%M UTC') ($(git rev-parse --short HEAD))"
            echo
            if [ -n "$LAST_TAG" ]; then
              echo "Стабильный релиз: \`${LAST_TAG}\`."
              echo
              echo "Изменения после \`${LAST_TAG}\`:"
              echo
              git log "${LAST_TAG}..HEAD" --format='- %h %s' | head -40
              echo
              echo "Полный diff: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${LAST_TAG}...${SHA}"
            else
              echo "Стабильных тегов нет:"
              echo
              git log -20 --format='- %h %s'
            fi
            echo
            echo 'Образ этой сборки:'
            echo '```'
            echo "docker pull ghcr.io/vsibilev007/telemt-bot:main"
            echo '```'
          } > /tmp/rolling.md
          gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release edit rolling --repo "$GITHUB_REPOSITORY" \
                 --notes-file /tmp/rolling.md --prerelease --latest=false \
            || gh release create rolling --repo "$GITHUB_REPOSITORY" \
                 --target "$SHA" --title "Latest build (main)" \
                 --notes-file /tmp/rolling.md --prerelease
          # тег должен указывать на свежий коммит
          git tag -f rolling "$SHA"
          git push -f origin rolling
